<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="navbar">
    <div class="logo">AI Resume Analyzer</div>

    <div class="menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="history.html">History</a>
        <a href="profile.html">Profile</a>
    </div>
</div>

<div class="container">

<div class="hero">
<h1>Welcome</h1>
<p>Manage your resumes and ATS reports.</p>
</div>

<div class="cards">

<div class="card">
<h3>Total Resumes</h3>
<div class="big" id="count">0</div>
</div>

<div class="card">
<h3>Average ATS</h3>
<div class="big">85%</div>
</div>

<div class="card">
<h3>Status</h3>
<div class="big">Active</div>
</div>

</div>

<div class="chart-card">

<h2>Resume Overview</h2>

<div class="chart-container">

<canvas id="resumeChart"></canvas>

</div>

</div>

<div class="history-card">

<h2>Resume History</h2>

<table id="historyTable">

<thead>

<tr>

<th>ID</th>
<th>Skills</th>
<th>ATS Score</th>

</tr>

</thead>

<tbody></tbody>

</table>

</div>

<div class="buttons">

<a href="index.html" class="btn">Analyze Resume</a>

<button class="btn" onclick="logout()">Logout</button>

</div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
