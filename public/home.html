<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Resume Analyzer</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#2563eb);
}

.card{
    background:white;
    padding:50px;
    width:450px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

h1{
    color:#2563eb;
    margin-bottom:15px;
}

p{
    color:#555;
    margin-bottom:30px;
}

.btn{
    display:block;
    text-decoration:none;
    background:#2563eb;
    color:white;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

</style>

</head>
<body>

<div class="card">

    <h1>🚀 AI Resume Analyzer</h1>

    <p>
        Analyze resumes, ATS Score, AI Suggestions,
        Resume History and Reports
    </p>

    <a href="register.html" class="btn">
        Register
    </a>

    <a href="login.html" class="btn">
        Login
    </a>

</div>

</body>
</html>
